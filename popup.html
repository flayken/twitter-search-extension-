<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Top 3 Tweets</title>
<link rel="stylesheet" href="popup.css"/>
</head>
<body>
<div class="shell">
  <div class="header-row">
    <div class="badge">T3</div>
    <div class="title">Top 3 Tweets</div>
    <div class="meta">Same-tab · Minimal</div>
    <button id="stop" class="btn danger" style="display:none">Stop</button>
  </div>

  <div class="row search">
    <svg viewBox="0 0 24 24" class="mag"><path fill="currentColor" d="M10 4a6 6 0 104.472 10.027l3.25 3.25 1.415-1.415-3.25-3.25A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
    <input id="kw" class="pill" placeholder="Keyword e.g. doge"/>
    <button id="go" class="btn primary">Start</button>
  </div>

  <div class="grid toggles">
    <label class="chk"><input id="rt" type="checkbox" checked/><span>Exclude RTs</span></label>
    <label class="chk"><input id="ageApply" type="checkbox" checked/><span>Apply age</span></label>
    <label class="chk"><input id="autoScroll" type="checkbox" checked/><span>Auto scroll</span></label>
    <label class="chk"><input id="pinWin" type="checkbox"/><span>Pin window (mini)</span></label>
  </div>

  <div class="grid duo">
    <div class="field">
      <label>Max age (d)</label>
      <input id="ageD" type="number" min="1" step="1" value="1"/>
    </div>
    <div class="field">
      <label>Mode</label>
      <select id="mode">
        <option value="top" selected>Top</option>
        <option value="latest">Latest</option>
      </select>
    </div>
  </div>

  <div class="section-title">Advanced filters</div>
  <div class="grid tri boxed">
    <div class="field boxed">
      <label>min_replies</label>
      <input id="minC" type="number" min="0" step="1" value="0"/>
    </div>
    <div class="field boxed">
      <label>min_retweets</label>
      <input id="minR" type="number" min="0" step="1" value="0"/>
    </div>
    <div class="field boxed">
      <label>min_likes</label>
      <input id="minF" type="number" min="0" step="1" value="0"/>
    </div>
  </div>

  <div id="status" class="status">Ready.</div>
  <div id="results" class="results"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
