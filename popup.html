<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XSearch – Hub</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app panel" role="application" aria-label="XSearch">
    <!-- Header -->
    <header class="hdr">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
            <path d="M8 10v26c0 6 3.2 11.4 8.4 14.6L32 58l15.6-7.4C52.8 47.4 56 42 56 36V10H8z" fill="none" stroke="#1f2a3a" stroke-width="4"/>
            <path d="M24 20l-7 10m0 0l7 10m-7-10h16" stroke="#e6ebf2" stroke-width="5" stroke-linecap="round"/>
            <path d="M42 20h-7l-3 4v4c0 2 1 4 3 5l7 4c2 1 3 3 3 5 0 3-2 6-5 8l-10 6" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="title">XSearch</div>
          <div class="tag">Smarter Twitter search</div>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme (light/dark)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.03-1-.1-1.5A6.5 6.5 0 0 1 12 3Z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 15 3-3-3-3"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
      </button>
    </header>

    <!-- Search -->
    <section class="search" aria-label="Search controls">
      <div class="search-row">
        <label class="field" style="min-width:0;">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21 16.65 16.65"/></svg>
          <input id="q" placeholder="Keyword e.g. doge" autocomplete="off" />
          <div class="segmented" role="tablist" aria-label="Mode">
            <button type="button" class="seg" data-mode="top" aria-pressed="true" aria-label="Top">Top</button>
            <button type="button" class="seg" data-mode="latest" aria-label="Latest">Latest</button>
          </div>
        </label>
        <button id="start" class="start" type="button">
          <span class="txt">Start</span>
        </button>
      </div>

      <div class="chips" aria-label="Quick filters">
        <label class="chip"><input id="excludeRTs" type="checkbox" checked><span>Exclude RTs</span></label>
        <label class="chip"><input id="applyAge" type="checkbox" checked><span>Apply age</span></label>
        <label class="chip"><input id="autoScroll" type="checkbox"><span>Auto scroll</span></label>
        <label class="chip"><input id="pinWindow" type="checkbox"><span>Pin window</span></label>
      </div>

      <!-- Advanced filters -->
      <details class="adv" id="adv" open>
        <summary>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
          Advanced filters
        </summary>
        <div class="grid" role="group" aria-label="Advanced">
          <div class="num" style="order:1"><label for="maxAge">Max age (days)</label><input id="maxAge" type="number" min="0" step="1" value="5"></div>
          <div class="num" style="order:2"><label for="pinMinutes">Pin window (min)</label><input id="pinMinutes" type="number" min="0" step="1" value="0"></div>
          <div class="num" style="order:3"><label for="limit">Max tweets</label><input id="limit" type="number" min="1" max="5" step="1" value="3"></div>
          <div class="num" style="order:4"><label for="minReplies"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg> Min Replies</label><input id="minReplies" type="number" min="0" step="1" value="0"></div>
          <div class="num" style="order:5"><label for="minLikes"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg> Min Likes</label><input id="minLikes" type="number" min="0" step="1" value="100"></div>
          <div class="num" style="order:6"><label for="minRetweets"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Min Retweets</label><input id="minRetweets" type="number" min="0" step="1" value="0"></div>
        </div>
      </details>
    </section>

    <div class="progress" hidden id="progress"><i></i></div>

    <!-- Results -->
    <section class="results" aria-live="polite" aria-busy="false" id="resultsWrap">
      <div class="meta" id="status">Ready. No scan running.</div>
      <div id="results"></div>
    </section>

    <footer class="ftr">
      <span>Tip: Press <kbd>Enter</kbd> to start</span>
    </footer>
  </main>

  <!-- Tweet template -->
  <template id="tweetTemplate">
    <article class="tweet">
      <div class="t-h">
        <div class="rank">#</div>
        <div class="user">Display Name</div>
        <div class="handle">@handle · 2h</div>
        <div class="spcr"></div>
        <div class="score" title="Score"><span class="score-label">Score</span><span class="score-value">—</span></div>
        <div class="act">
          <button class="btn" data-action="open">View</button>
          <button class="btn" data-action="save">Save</button>
        </div>
      </div>
      <div class="t-b">
        <p>Tweet content would go here. You can inject full text, links and media previews.</p>
      </div>
      <div class="stats">
        <span title="Replies" aria-label="Replies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg> 0</span>
        <span title="Retweets" aria-label="Retweets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> 0</span>
        <span title="Likes" aria-label="Likes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg> 0</span>
      </div>
      <div class="snake" aria-hidden="true">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
            </filter>
            <mask id="outerOnly">
              <rect class="plate" x="0" y="0" width="100" height="100" />
              <rect class="cut"  x="1" y="1" width="98" height="98" pathLength="1" />
            </mask>
          </defs>
          <rect class="halo" x="1" y="1" width="98" height="98" pathLength="1" mask="url(#outerOnly)" />
        </svg>
      </div>
    </article>
  </template>

  <script src="popup.js"></script>
</body>
</html>
